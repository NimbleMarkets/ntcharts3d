<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ntcharts3d gallery</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; color: #f4f1ea; }
    #terminal { height: 100%; padding: 4px; }
    #status { position: absolute; inset: 0; display: grid; place-content: center; padding: 2rem; font: 16px/1.5 system-ui, sans-serif; white-space: pre-wrap; }
    #status[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="terminal"></div>
  <div id="status" role="status">Loading gallery…</div>
  <script src="wasm_exec.js"></script>
  <script type="module" src="../runtime.js"></script>
</body>
</html>
