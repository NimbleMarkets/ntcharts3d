name: Build Go

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: NimbleTerminal/nt3d
          ref: 972f2a4220a42f3bc148e6505ff992aaa6d6caa5
          path: .deps/nt3d
      - uses: actions/checkout@v7
        with:
          repository: NimbleTerminal/ntpicture
          ref: 1a8609901740ed0a22cc7f729a5aa0694d6578f1
          path: .deps/ntpicture
      - uses: actions/setup-go@v7
        with:
          # The examples require a newer patch release than the library.
          go-version-file: examples/gallery/go.mod
          cache-dependency-path: |
            go.sum
            examples/gallery/go.sum
            examples/transport/go.sum
      - name: Install Task
        uses: go-task/setup-task@v2
        with:
          version: '3.x'
      - name: Check all modules and build native/WASM examples
        run: task ci
